<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario de bienestar — Helpsy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="cuestionario-shell">

        <div class="cuestionario-topbar">
            <div class="cuestionario-logo">
                <svg viewBox="0 0 32 32" fill="none"><path d="M16 3c-2 3-6 5-10 5v8c0 8 5.5 12.5 10 13.5C20.5 28.5 26 24 26 16V8c-4 0-8-2-10-5Z" fill="url(#g2)"/><path d="M13 16h2.5v-2.5a.5.5 0 0 1 1 0V16H19a.5.5 0 0 1 0 1h-2.5v2.5a.5.5 0 0 1-1 0V17H13a.5.5 0 0 1 0-1Z" fill="white"/><defs><linearGradient id="g2" x1="6" y1="3" x2="26" y2="28"><stop stop-color="#6ea8ff"/><stop offset="1" stop-color="#3b6df0"/></linearGradient></defs></svg>
                <span>Helpsy</span>
            </div>
            <button class="btn btn-fantasma btn-sm" id="btn-omitir">Responder luego</button>
        </div>

        <div class="cuestionario-progreso-pista">
            <div class="cuestionario-progreso-relleno" id="progreso-relleno"></div>
        </div>

        <main class="cuestionario-contenido">

            <!-- INTRO -->
            <section id="pantalla-intro" class="cuestionario-tarjeta">
                <span class="mini-etiqueta" style="color:var(--azul-600);">Antes de empezar</span>
                <h1>Cuéntanos cómo te has sentido</h1>
                <p>
                    Son <span id="total-preguntas"></span> preguntas rápidas,
                    tipo sí/no. No es un diagnóstico: es contexto inicial
                    para tu psicólogo y para adaptar tu experiencia en
                    Helpsy. Puedes responder con honestidad, esto no se
                    comparte públicamente.
                </p>
                <button class="btn btn-primario" id="btn-empezar">Comenzar</button>
            </section>

            <!-- PREGUNTA -->
            <section id="pantalla-pregunta" class="cuestionario-tarjeta oculto">
                <p class="cuestionario-contador" id="contador-pregunta"></p>
                <h2 id="texto-pregunta"></h2>
                <div class="cuestionario-opciones" id="opciones-pregunta"></div>
            </section>

            <!-- RESULTADO -->
            <section id="pantalla-resultado" class="cuestionario-tarjeta oculto"></section>

        </main>

    </div>

    <script src="js/data.js" defer></script>
    <script src="js/common.js" defer></script>
    <script src="js/cuestionario.js" defer></script>

</body>
</html>
