<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tareas — Helpsy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="app-shell">

        <div id="helpsy-sidebar"></div>

        <main class="contenido">

            <div class="topbar" id="helpsy-topbar"></div>

            <p class="info-modulo" id="info-tareas"></p>

            <section class="tarjeta">
                <div class="tarjeta-encabezado">
                    <div>
                        <h2 id="titulo-tareas">Tareas</h2>
                        <p id="contador-tareas">Cargando...</p>
                    </div>
                    <button class="btn btn-primario btn-sm oculto" id="btn-nueva-tarea">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Asignar tarea
                    </button>
                </div>
                <div id="lista-tareas"></div>
            </section>

        </main>

    </div>

    <!-- MODAL: nueva tarea (solo psicólogo) -->
    <div class="modal-overlay" id="modal-tarea" role="dialog" aria-modal="true">
        <div class="modal-caja">
            <div class="modal-caja-encabezado">
                <div><h2>Asignar tarea</h2><p>Elige el paciente y describe la actividad.</p></div>
                <button class="btn-icono" id="cerrar-modal-tarea" aria-label="Cerrar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <form id="form-tarea">
                <div class="campo" style="margin-bottom: 14px;">
                    <label for="tarea-paciente">Paciente</label>
                    <select class="select-simple" id="tarea-paciente"></select>
                </div>
                <div class="campo" style="margin-bottom: 14px;">
                    <label for="tarea-titulo">Título</label>
                    <input type="text" class="input-simple" id="tarea-titulo" maxlength="70" placeholder="Ej: Practicar respiración 5 minutos al día">
                </div>
                <div class="campo">
                    <label for="tarea-descripcion">Descripción</label>
                    <textarea class="input-simple" id="tarea-descripcion" rows="3" placeholder="Detalles de la actividad"></textarea>
                </div>
                <div class="modal-acciones">
                    <button type="button" class="btn btn-fantasma" id="cancelar-modal-tarea">Cancelar</button>
                    <button type="submit" class="btn btn-primario">Asignar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/data.js" defer></script>
    <script src="js/common.js" defer></script>
    <script src="js/tareas.js" defer></script>

</body>
</html>
